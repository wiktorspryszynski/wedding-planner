# /etc/nginx/sites-available/slub.spryszynski.pl  (then: ln -s ../sites-available/... sites-enabled/, certbot --nginx -d slub.spryszynski.pl)
server {
    listen 80;
    server_name slub.spryszynski.pl;

    client_max_body_size 5m;  # CSV import

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages stream their data after the static shell — don't buffer.
        proxy_buffering off;
    }
}
